apiVersion: apps/v1
kind: Deployment
metadata:
  name: surveyapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: surveyapp
  template:
    metadata:
      labels:
        app: surveyapp
    spec:
      containers:
        - name: surveyapp
          image: surveyapp:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: surveyapp-service
spec:
  type: NodePort
  selector:
    app: surveyapp
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080
